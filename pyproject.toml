[project]
name = "agentic_dagster_demo"
requires-python = ">=3.10,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.12.2",
    "dagster-cloud>=1.12.2",
    "dagster-dbt>=0.28.2",
    "dbt-duckdb>=1.10.0",
    "dbt-snowflake>=1.10.3",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "agentic_dagster_demo"
registry_modules = [
    "agentic_dagster_demo.components.*",
]


